name: Cleanup Expired Orders & Seats

on:
  schedule:
    # Run every hour at minute 0 (within free GitHub Actions monthly allowance)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      batch_limit:
        description: 'Maximum number of expired orders to process'
        required: false
        default: '50'

concurrency:
  group: order-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Execute Self-Managed Order Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Cleanup Job
        env:
          FIREBASE_PROJECT_ID: udaytravels-ad458
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          PAYMENT_PROVIDER_SECRET: ${{ secrets.PAYMENT_PROVIDER_SECRET }}
        run: npx tsx backend/src/jobs/cleanup-expired-orders.ts
